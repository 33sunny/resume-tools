name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run tests
        run: python3 -m unittest discover
      - name: Compile Python files
        run: python3 -m py_compile resume_picker/*.py resume_picker/providers/*.py tests/*.py bin/claude-resume bin/codex-resume bin/codex-proxy-resume
